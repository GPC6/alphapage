function visibleRuns(){return DATA.runs.filter(r=>r.status==='completed'&&r.scenario===scenario&&(repeat==='all'||r.mode==='legacy'||String(r.repeat)===repeat)).sort((a,b)=>['legacy','draft','standard','reference'].indexOf(a.mode)-['legacy','draft','standard','reference'].indexOf(b.mode)||a.repeat-b.repeat)}
function panelCard(p,r,compact=false){return `<article class="${compact?'compare-card':'panel'}" data-run="${esc(r.mode_label)}" data-repeat="${r.repeat}" data-panel="${encodeURIComponent(JSON.stringify(p))}"><img loading="lazy" src="${encodeURI(p.image)}" alt="${esc(p.shot_name)}"><div class="${compact?'caption':'panel-caption'}"><b>${esc(r.mode_label)} · R${r.repeat} · P${p.index}</b><small>${esc(p.shot_name)}${p.action?' — '+esc(p.action):''}</small></div></article>`}
function renderBoard(r){let elapsed=r.elapsed_seconds==null?'저장 기준':r.elapsed_seconds.toFixed(1)+'초';let sheet=r.reference_sheets?.length?` · reference sheet ${r.reference_sheets.length}장`:'';let refs=r.reference_sheets?.length?`<details class="references"><summary>생성에 사용한 reference sheet ${r.reference_sheets.length}장 보기</summary><div class="reference-grid">${r.reference_sheets.map((path,i)=>`<a href="${encodeURI(path)}" target="_blank"><img loading="lazy" src="${encodeURI(path)}" alt="Reference sheet ${i+1}">${i===0?'Location':`Subject ${i}`}</a>`).join('')}</div></details>`:'';return `<section class="board"><div class="board-head"><span class="mode-chip" style="background:${colors[r.mode]}">${esc(r.mode_label)}</span><b>반복 ${r.repeat}</b><span class="meta">${r.panel_count}컷${sheet}</span><span class="meta">${elapsed}</span></div><div class="filmstrip">${r.panels.map(p=>panelCard(p,r)).join('')}</div>${refs}</section>`}

function bindCards(){document.querySelectorAll('[data-panel]').forEach(el=>el.onclick=()=>{let p=JSON.parse(decodeURIComponent(el.dataset.panel));byId('large-image').src=p.image;byId('detail-title').textContent=`${el.dataset.run} · 반복 ${el.dataset.repeat} · Panel ${p.index} · ${p.shot_name}`;byId('detail-action').textContent=p.action||'동작 설명 없음';byId('detail-metrics').textContent=`${p.width}×${p.height} · ${(p.bytes/1024).toFixed(0)} KB

document.querySelectorAll('.scenario-tab').forEach(b=>b.onclick=()=>{scenario=b.dataset.scenario;render()});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});byId('repeat').onchange=e=>{repeat=e.target.value;render()};byId('close').onclick=()=>byId('dialog').close();byId('dialog').onclick=e=>{if(e.target===byId('dialog'))byId('dialog').close()};
